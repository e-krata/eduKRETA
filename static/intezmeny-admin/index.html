<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intézmény admin – eduKRÉTA</title>
  <style>
    :root { --bg:#10141f; --card:#191e2c; --text:#ecf0f9; --muted:#a0abc0; --accent:#6ba7ff; --border:#2a3243; --ok:#68c5a0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .layout { display:grid; grid-template-columns: 220px 1fr; min-height:100vh; }
    aside { border-right:1px solid var(--border); padding:20px 14px; background:var(--card); }
    aside h1 { font-size:15px; margin:0 0 4px; }
    aside .sub { color:var(--muted); font-size:12px; margin-bottom:20px; }
    aside button { display:block; width:100%; text-align:left; background:transparent; border:0; color:var(--muted); padding:10px 12px; border-radius:10px; cursor:pointer; font:inherit; margin-bottom:4px; }
    aside button.active, aside button:hover { background:#252e40; color:var(--text); }
    main { padding:28px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
    h2 { margin:0 0 12px; font-size:1.25rem; }
    .muted { color:var(--muted); font-size:13px; }
    input, select, textarea { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; margin:6px 0 12px; font:inherit; }
    .btn { background:var(--accent); color:#111; border:0; border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer; }
    .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .login { max-width:400px; margin:60px auto; }
    pre { background:#0c1018; padding:12px; border-radius:10px; overflow:auto; font-size:12px; }
    @media(max-width:800px){ .layout{grid-template-columns:1fr;} aside{display:none;} }
  </style>
</head>
<body>
  <div id="loginView" class="login card">
    <h2>Intézmény admin</h2>
    <p class="muted">Diák/tanár tokennel (Bearer) – tanár / ofő / igazgató szerepkör ajánlott.</p>
    <label class="muted">Intézménykód</label>
    <input id="instCode" />
    <label class="muted">Felhasználónév</label>
    <input id="user" />
    <label class="muted">Jelszó</label>
    <input id="pass" type="password" />
    <button class="btn" id="loginBtn" style="width:100%">Belépés</button>
    <p class="muted" id="loginErr" style="color:#f292a4;display:none;margin-top:10px"></p>
  </div>

  <div id="app" class="layout" style="display:none">
    <aside>
      <h1 id="sideName">Intézmény</h1>
      <div class="sub" id="sideCode"></div>
      <button data-page="overview" class="active">Áttekintés</button>
      <button data-page="users">Felhasználók</button>
      <button data-page="classes">Osztályok</button>
      <button data-page="kir">KIR</button>
      <button data-page="szir">SZIR</button>
      <button data-page="links">Egyedi URL-ek</button>
      <button id="logoutBtn" style="margin-top:24px">Kijelentkezés</button>
    </aside>
    <main>
      <div id="content"></div>
    </main>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let token = localStorage.getItem("ia_token") || "";
let institute = params.get("institute_code") || localStorage.getItem("institute_code") || "demo";
$("instCode").value = institute;

async function api(path, opts={}) {
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if (token) headers["Authorization"] = "Bearer " + token;
  const r = await fetch(path, {...opts, headers});
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch { data = text; }
  if (!r.ok) throw new Error(typeof data === "object" ? (data.error||JSON.stringify(data)) : text);
  return data;
}

$("loginBtn").onclick = async () => {
  institute = $("instCode").value.trim();
  const body = new URLSearchParams({
    username: $("user").value.trim(),
    password: $("pass").value,
    institute_code: institute,
    grant_type: "password",
    client_id: "kreta-ellenorzo-mobile"
  });
  try {
    const r = await fetch("/connect/token", {
      method: "POST",
      headers: {"Content-Type":"application/x-www-form-urlencoded"},
      body
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "login_failed");
    token = j.access_token;
    localStorage.setItem("ia_token", token);
    localStorage.setItem("institute_code", institute);
    $("loginView").style.display = "none";
    $("app").style.display = "grid";
    show("overview");
  } catch (e) {
    $("loginErr").style.display = "block";
    $("loginErr").textContent = String(e.message || e);
  }
};

$("logoutBtn").onclick = () => {
  localStorage.removeItem("ia_token");
  location.reload();
};

document.querySelectorAll("aside button[data-page]").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("aside button[data-page]").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    show(b.dataset.page);
  };
});

async function show(page) {
  const el = $("content");
  el.innerHTML = "Betöltés…";
  try {
    if (page === "overview") {
      const info = await api("/api/intezmeny/info?institute_code=" + encodeURIComponent(institute));
      $("sideName").textContent = info.name || institute;
      $("sideCode").textContent = info.code || institute;
      el.innerHTML = `<h2>Áttekintés</h2>
        <div class="card"><b>${info.name||institute}</b>
        <p class="muted">Kód: ${info.code||institute} · Szerepkör: ${info.role||"—"}</p>
        <pre>${JSON.stringify(info, null, 2)}</pre></div>`;
    } else if (page === "users") {
      const users = await api("/api/intezmeny/users?institute_code=" + encodeURIComponent(institute));
      const rows = (Array.isArray(users)?users:[]).map(u =>
        `<tr><td>${u.username||""}</td><td>${u.role||""}</td><td>${u.active===false?"inaktív":"aktív"}</td></tr>`).join("") || `<tr><td colspan="3">Nincs adat</td></tr>`;
      el.innerHTML = `<h2>Felhasználók</h2><div class="card table-wrap"><table><thead><tr><th>User</th><th>Szerep</th><th>Státusz</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    } else if (page === "classes") {
      const list = await api("/api/intezmeny/classgroups?institute_code=" + encodeURIComponent(institute));
      const arr = Array.isArray(list)?list:[];
      const rows = arr.map(g => `<tr><td>${g.Uid||g.uid||""}</td><td>${g.Nev||g.nev||""}</td></tr>`).join("") || `<tr><td colspan="2">Üres</td></tr>`;
      el.innerHTML = `<h2>Osztályok</h2>
        <div class="card"><div class="toolbar">
          <input id="cgNev" placeholder="Új osztály neve" style="max-width:200px" />
          <button class="btn" id="cgAdd">Hozzáadás</button>
        </div>
        <table><thead><tr><th>UID</th><th>Név</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      $("cgAdd").onclick = async () => {
        const Nev = $("cgNev").value.trim();
        if (!Nev) return;
        await api("/api/intezmeny/classgroups?institute_code=" + encodeURIComponent(institute), {
          method:"POST", body: JSON.stringify({Nev})
        });
        show("classes");
      };
    } else if (page === "kir") {
      el.innerHTML = `<h2>KIR</h2>
        <div class="card"><button class="btn" id="kirTok">Token</button> <code id="kirT"></code></div>
        <div class="card">
          <input id="kirExt" placeholder="externalId" />
          <button class="btn" id="kirSend">Kérelem beküldése</button>
          <pre id="kirOut"></pre>
        </div>`;
      $("kirTok").onclick = async () => {
        const j = await fetch("/kir/token",{method:"POST"}).then(r=>r.json());
        $("kirT").textContent = j.access_token||"";
      };
      $("kirSend").onclick = async () => {
        const j = await fetch("/kir/kerelem/bekuldes",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({externalId:$("kirExt").value.trim()})}).then(r=>r.json());
        $("kirOut").textContent = JSON.stringify(j,null,2);
      };
    } else if (page === "szir") {
      el.innerHTML = `<h2>SZIR</h2>
        <div class="card">
          <button class="btn" id="szSt">Státusz</button>
          <button class="btn btn-ghost" id="szAd">Adatszolg</button>
          <pre id="szOut"></pre>
        </div>`;
      const body = {IntezmenyAzonosito: institute, TanevId: 2025};
      $("szSt").onclick = async () => {
        $("szOut").textContent = JSON.stringify(await fetch("/szirstat/external/ksh2535/statusz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json()),null,2);
      };
      $("szAd").onclick = async () => {
        $("szOut").textContent = JSON.stringify(await fetch("/szirstat/external/ksh2535/adatszolg",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,StatuszAllapot:1,FeladatEllatasiHelyek:[]})}).then(r=>r.json()),null,2);
      };
    } else if (page === "links") {
      const origin = location.origin;
      el.innerHTML = `<h2>Egyedi URL-ek</h2>
        <div class="card">
          <p>Path-alapú (mindig működik):</p>
          <pre>${origin}/i/${institute}/
${origin}/i/${institute}/intezmeny-admin/
${origin}/i/${institute}/diak/</pre>
          <p class="muted">Subdomain: állítsd be a <code>TENANT_BASE_DOMAIN</code> env-et (pl. <code>edukreta.hu</code>), és DNS wildcardot:
          <code>*.edukreta.hu → szerver</code>. Ezután: <code>https://${institute}.edukreta.hu/</code></p>
        </div>`;
    }
  } catch (e) {
    el.innerHTML = `<div class="card" style="color:#f292a4">${e.message||e}</div>`;
  }
}

if (token) {
  $("loginView").style.display = "none";
  $("app").style.display = "grid";
  show("overview");
}
</script>
</body>
</html>
